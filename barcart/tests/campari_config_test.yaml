preloads:
  - ${SNPIT_DEFAULT_CONFIG}

photometry:
  campari:
    cutout_size: 11
    initial_flux_guess: 3000
    fetch_SED: false
    use_roman: true
    weighting: true
    make_initial_guess: true
    method: lsqr
    pixel: false
    subtract_background_method: calculate
    use_real_images: true
    print_memory_usage: false
    preplot_cutouts: true

    psf:
      galaxy_class: ou24PSF
      transient_class: ou24PSF_slow

    grid_options:
      type: contour
      percentiles:
      - 0
      - 90
      - 98
      - 100
      spacing: 0.75
      turn_grid_off: false
      gaussian_var: -1 # Gaussian weighting off by default
      cutoff: 4
      error_floor: 1
      subsize: 4

  campari_io:
    output_dir: out_dir
    debug_dir: debug_dir
    save_debug: true
    test_num: 1
    test_data: /home/packages/campari_test_data
    campari_simulations:
    avoid_non_linearity: false
    background_level: 0
    bg_gal_flux: 100000.0
    deltafcn_profile: false
    do_rotation: true
    do_xshift: true
    mismatch_seds: false
    noise: 0
    sim_gal_dec_offset: 0.00001
    sim_gal_ra_offset: 0.00001
    single_grid_point: false
    sim_galaxy_scale: 1.0
    sim_galaxy_offset: .00001414 # sqrt(2) * 1e-5
    base_pointing: 276
    base_sca: 10
    run_name: whatever

  snappl:
    simdex_server: https://roman-desc-simdex.lbl.gov/

  test_data: ${SNPIT_DIR}/packages/photometry_test_data
