[project]
name = "barcart"
description = "Orchestration workflow for Roman WFI supernova candidate discovery and follow-up"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Roman Supernova PIT" }]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

dependencies = [
    "roman_snpit_snappl>=0.41",
    "crds>=13.2.7",
    "sfft-romansnpit>=1.6.4.dev16",
]

[project.optional-dependencies]
test = ["pytest>=9.1"]
docs = ["sphinx"]

[project.scripts]
barcart = "barcart.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barcart*"]

[tool.pytest.ini_options]
testpaths = ["barcart/tests"]

[tool.ruff]
line-length = 120
